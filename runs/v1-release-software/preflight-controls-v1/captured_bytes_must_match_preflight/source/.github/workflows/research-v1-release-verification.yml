name: V1 development release software qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-v1-release-software
  cancel-in-progress: false

jobs:
  qualify-current-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.1'
      - name: Run bounded current core, replay and source-derived bank checks
        run: >-
          python -I -S -B scripts/verify_research_v1_release.py --execute
          --output runs/v1-release-software/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain complete software outcomes and failed allocations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: research-v1-release-software-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/v1-release-software/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
