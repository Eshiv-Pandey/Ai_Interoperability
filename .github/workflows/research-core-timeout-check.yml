name: Research core owned timeout check v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timeout-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.1'
      - name: Verify actual coordinator and delayed-child cleanup
        run: >-
          python -I -S -B scripts/ci_research_core_v2.py --test-timeouts
          --output runs/core-timeout-check/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain raw test streams and owned-process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-timeout-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/core-timeout-check/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
