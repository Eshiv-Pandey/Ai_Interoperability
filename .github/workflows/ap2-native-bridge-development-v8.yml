name: AP2 native TCP and legal unchanged bridge initiation development v8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-native-bridge-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Prepare exact AP2 source and sealed original bridge runtime without requests
        shell: bash
        run: |
          python -I -S -B scripts/ap2_reference_development_v8.py prepare --output "$RUNNER_TEMP/ap2-v8/prepared"
          python -m venv "$RUNNER_TEMP/ap2-v8-environment"
      - name: Install one fresh pinned Python runtime before guarded cases
        shell: bash
        run: |
          "$RUNNER_TEMP/ap2-v8-environment/bin/python" -m pip install --report "$RUNNER_TEMP/ap2-v8/pip-install-report.json" -r "$RUNNER_TEMP/ap2-v8/prepared/requirements.txt"
          "$RUNNER_TEMP/ap2-v8-environment/bin/python" -m pip check > "$RUNNER_TEMP/ap2-v8/pip-check.txt"
      - name: Run inherited controls and new TCP ownership, legal mapping and guard controls
        shell: bash
        run: |
          "$RUNNER_TEMP/ap2-v8-environment/bin/python" -B -m unittest discover -s tests -p test_ap2_reference_development_v5.py -v
          "$RUNNER_TEMP/ap2-v8-environment/bin/python" -B -m unittest discover -s tests -p test_ap2_native_bridge_development_v8.py -v
      - name: Freeze all 104 prospective cells before separate smoke cases
        shell: bash
        run: |
          python -I -S -B scripts/run_ap2_native_bridge_matrix_v8.py --prepare-only \
            --output "$RUNNER_TEMP/ap2-v8/matrix" \
            --site-packages "$RUNNER_TEMP/ap2-v8-environment/lib/python3.13/site-packages" \
            --bridge-runtime "$RUNNER_TEMP/ap2-v8/prepared/bridge-runtime" --node "$(node -p process.execPath)"
      - name: Execute and independently evaluate native and three legal bridge smoke cases
        shell: bash
        run: |
          for arm in conventional amir_typed mg_typed mg_raw; do
            python -I -S -B scripts/ap2_reference_development_v8.py execute \
              --output "$RUNNER_TEMP/ap2-v8/smoke/$arm" \
              --site-packages "$RUNNER_TEMP/ap2-v8-environment/lib/python3.13/site-packages" \
              --bridge-runtime "$RUNNER_TEMP/ap2-v8/prepared/bridge-runtime" --node "$(node -p process.execPath)" \
              --case human_demo_otp --arm "$arm"
            python -I -S -B scripts/evaluate_ap2_native_bridge_matrix_v8.py \
              --cell "$RUNNER_TEMP/ap2-v8/smoke/$arm" --output "$RUNNER_TEMP/ap2-v8/smoke-evaluation/$arm" \
              --site-packages "$RUNNER_TEMP/ap2-v8-environment/lib/python3.13/site-packages"
          done
      - name: Execute exactly the preallocated 104 cells with fresh state and owned sockets
        shell: bash
        run: |
          python -I -S -B scripts/run_ap2_native_bridge_matrix_v8.py --resume-prepared \
            --output "$RUNNER_TEMP/ap2-v8/matrix" \
            --site-packages "$RUNNER_TEMP/ap2-v8-environment/lib/python3.13/site-packages" \
            --bridge-runtime "$RUNNER_TEMP/ap2-v8/prepared/bridge-runtime" --node "$(node -p process.execPath)"
      - name: Retain all unexecuted cells after failed smoke and independently evaluate actual captures
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/ap2-v8/matrix/allocation-manifest.json" ]; then
            if [ ! -f "$RUNNER_TEMP/ap2-v8/matrix/execution-results.json" ]; then
              python -I -S -B scripts/run_ap2_native_bridge_matrix_v8.py --finalize-unexecuted \
                --output "$RUNNER_TEMP/ap2-v8/matrix" \
                --site-packages "$RUNNER_TEMP/ap2-v8-environment/lib/python3.13/site-packages" \
                --bridge-runtime "$RUNNER_TEMP/ap2-v8/prepared/bridge-runtime" --node "$(node -p process.execPath)"
            fi
            python -I -S -B scripts/evaluate_ap2_native_bridge_matrix_v8.py \
              --matrix "$RUNNER_TEMP/ap2-v8/matrix" --output "$RUNNER_TEMP/ap2-v8/independent-evaluation" \
              --site-packages "$RUNNER_TEMP/ap2-v8-environment/lib/python3.13/site-packages"
          fi
      - name: Retain actual source/runtime/socket evidence, all failures and original MCP replies
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ap2-native-tcp-legal-bridge-initiation-development-v8
          path: ${{ runner.temp }}/ap2-v8/
          if-no-files-found: error
          retention-days: 30
