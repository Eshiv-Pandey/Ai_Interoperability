name: Guard-pruned development comparison v3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-pruned-development-comparison-v3
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the selected research revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select the Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.1'
      - name: Run adversarial and differential finite checks
        run: python -I -S -B tests/test_direct_guard_pruned_v3.py -v
      - name: Run all original profiles and budgets in a fresh allocation
        run: >-
          python -I -S -B scripts/run_guard_pruned_comparison_v3.py
          --source runs/shared-lifting-scaling/v3-20261110-1
          --output runs/guard-pruned-comparison/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve attempted worker results and sources
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guard-pruned-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/guard-pruned-comparison/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
